[project]
name = "recoverx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TanayKumar-V2", email = "tanayk726@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "cohere>=7.0.9",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.62.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
recoverx = "recoverx:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
